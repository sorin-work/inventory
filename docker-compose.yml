name: inventory

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-inventory-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - '${DB_PORT:-5445}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u inventory -pinventory --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    environment:
      APP_NAME: Inventory
      APP_URL: http://localhost:${APP_PORT:-4405}
      # Local development key. Set your own with APP_KEY in .env.
      APP_KEY: ${APP_KEY:-base64:3Hw+TwR1WYDxSJB8fRwKtGAYB4DEAWFgDLv9IiSGTTg=}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      # Creates demo@example.com / demo-password with six months of sample data.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-4405}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  db-data:
